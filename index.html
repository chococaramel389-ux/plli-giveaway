<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLLI Freebie Board - บอร์ดรวมของแจกคอนเสิร์ต</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-500 to-pink-500 bg-clip-text text-transparent">
                ✨ PLLI Freebie Board
            </h1>
            <button onclick="openAddModal()" class="bg-black text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-800 transition">
                + ลงทะเบียนของแจก
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold mb-2">บอร์ดรวบรวมของแจกคอนเสิร์ต PLAVE</h2>
            <p class="text-slate-500 text-sm">รวมพิกัดของแจกน่ารักๆ ในคอนเสิร์ต เช็กสถานะ แจกอยู่ หรือ หมดแล้ว ได้ที่นี่!</p>
        </div>

        <!-- Grid Cards -->
        <div id="giveaway-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="text-center col-span-full py-10 text-slate-400">กำลังโหลดข้อมูลของแจก...</div>
        </div>
    </main>

    <!-- Modal สำหรับเพิ่มของแจก -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl">
            <h3 class="text-lg font-bold mb-4">ลงทะเบียนของแจกใหม่</h3>
            <form id="giveawayForm" onsubmit="addGiveaway(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ชื่อทวิตเตอร์ (เช่น @plave_official)</label>
                    <input type="text" id="twitterHandle" required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">โซน / จุดนัดรับ (เช่น โซน A หน้าฮอลล์)</label>
                    <input type="text" id="zone" required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">ลิงก์โพสต์ทวีต</label>
                    <input type="text" id="tweetUrl" placeholder="https://twitter.com/..." required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded-xl">ยกเลิก</button>
                    <button type="submit" class="px-4 py-2 text-sm bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // ตั้งค่าเชื่อมต่อ Supabase ของคุณ
        const SUPABASE_URL = 'https://xrpifshmpqpotalzqjsw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhycGlmc2htcXBvdGFsennqc3ciLCJyb2xlIjoiYW5vbiIsImlhdCI6MTc3MjQ2NjI0NCwiZXhwIjoyMDg4MDQyMjQ0fQ.YOUR_KEY_HERE_OR_PUBLIC_KEY'; // เดี๋ยวดึงค่า anon key มาใส่ตรงนี้ครับ
        
        // *หมายเหตุ: นำ Key "anon public" ที่ก๊อปปี้มาก่อนหน้านี้มาวางแทนที่ข้อความยาวๆ ข้างบนได้เลยครับ
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function fetchGiveaways() {
            const grid = document.getElementById('giveaway-grid');
            const { data, error } = await supabase.from('giveaways').select('*').order('id', { ascending: false });
            
            if (error) {
                grid.innerHTML = `<div class="text-center col-span-full py-10 text-rose-500">เกิดข้อผิดพลาดในการโหลดข้อมูล: ${error.message}</div>`;
                return;
            }

            if (!data || data.length === 0) {
                grid.innerHTML = `<div class="text-center col-span-full py-10 text-slate-400">ยังไม่มีของแจกในระบบ ลองกดปุ่ม "+ ลงทะเบียนของแจก" ด้านบนได้เลย!</div>`;
                return;
            }

            grid.innerHTML = data.map(item => `
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-3">
                            <span class="text-xs font-semibold text-slate-600">${item.twitter_handle}</span>
                            <span onclick="toggleStatus(${item.id}, '${item.status}')" class="px-2.5 py-1 rounded-full text-xs font-medium cursor-pointer ${item.status === 'หมดแล้ว' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
                                ${item.status === 'หมดแล้ว' ? '🔴 ของหมดแล้ว' : '🟢 กำลังแจก'}
                            </span>
                        </div>
                        <div class="bg-slate-50 rounded-xl p-4 text-center text-xs text-indigo-600 mb-3 border border-slate-100 truncate">
                            <a href="${item.tweet_url}" target="_blank" class="hover:underline">🔗 ดูลิงก์ทวีตต้นฉบับ</a>
                        </div>
                    </div>
                    <p class="text-xs text-slate-500 text-center">${item.zone}</p>
                </div>
            `).join('');
        }

        function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); }
        function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); }

        async function addGiveaway(e) {
            e.preventDefault();
            const twitter_handle = document.getElementById('twitterHandle').value;
            const zone = document.getElementById('zone').value;
            const tweet_url = document.getElementById('tweetUrl').value;

            const { error } = await supabase.from('giveaways').insert([{ twitter_handle, zone, tweet_url, status: 'กำลังแจก' }]);
            if (error) {
                alert('เกิดข้อผิดพลาด: ' + error.message);
            } else {
                closeAddModal();
                document.getElementById('giveawayForm').reset();
                fetchGiveaways();
            }
        }

        async function toggleStatus(id, currentStatus) {
            const newStatus = currentStatus === 'กำลังแจก' ? 'หมดแล้ว' : 'กำลังแจก';
            await supabase.from('giveaways').update({ status: newStatus }).eq('id', id);
            fetchGiveaways();
        }

        fetchGiveaways();
    </script>
</body>
</html>
