<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLLI Giveaways</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
    <link rel="icon" type="image/png" href="https://img.icons8.com/?size=100&id=VVRMVduP5ewo&format=png&color=000000">
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-500 to-pink-500 bg-clip-text text-transparent cursor-pointer" onclick="resetFilter()">
                ✨ #PLLIมาแจก
            </h1>
            <div id="auth-section" class="flex items-center space-x-3">
                <div id="login-container">
                    <button onclick="loginWithTwitter()" class="bg-black text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-800 transition flex items-center space-x-2">
                        <span>เข้าสู่ระบบด้วย X</span>
                    </button>
                </div>
                
                <!-- ส่วนแสดงชื่อและ Dropdown เมนู -->
                <div id="user-container" class="hidden relative flex items-center space-x-2">
                    <div class="relative">
                        <button type="button" onclick="toggleDropdown(event)" class="flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 px-3 py-1.5 rounded-full max-w-[150px] sm:max-w-none transition text-slate-700">
                            <span id="display-user" class="text-[11px] sm:text-xs font-semibold truncate"></span>
                            <span class="text-slate-400 text-[10px]">▼</span>
                        </button>
                        
                        <div id="userDropdown" class="absolute right-0 mt-2 w-44 bg-white border border-slate-100 rounded-2xl shadow-lg hidden py-1.5 z-50">
                            <button type="button" id="toggle-view-btn" onclick="event.stopPropagation(); toggleViewMode();" class="w-full text-left px-4 py-2.5 text-xs text-slate-700 hover:bg-slate-50 font-medium transition flex items-center space-x-2 border-b border-slate-100">
                                <span id="toggle-view-text">📌 ของฉัน</span>
                            </button>
                            <button type="button" onclick="event.stopPropagation(); logout();" class="w-full text-left px-4 py-2.5 text-xs text-rose-600 hover:bg-rose-50 font-medium transition flex items-center space-x-2">
                                <span>🚪 ออกจากระบบ</span>
                            </button>
                        </div>
                    </div>

                    <button onclick="openAddModal()" class="bg-indigo-600 text-white px-3 sm:px-4 py-2 rounded-full text-[11px] sm:text-sm font-medium hover:bg-indigo-700 transition flex-shrink-0">
                        + ลงทะเบียน กอว.
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold mb-2">#PLLIมาแจก - PLAVE World Tour [KEEP IT MANIC] in BKK</h2>
            <p id="sub-title" class="text-slate-500 text-sm">💙💜🩷❤️🖤</p>
        </div>
        
        <div id="giveaway-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            <div class="text-center col-span-full py-10 text-slate-400">กำลังโหลดข้อมูล...</div>
        </div>
    </main>

    <!-- Modal สำหรับเพิ่มของแจก -->
    <div id="addModal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-md w-full shadow-xl max-h-[90vh] overflow-y-auto">
            <h3 class="text-lg font-bold mb-4">ลงทะเบียน Giveaway</h3>
            <form id="giveawayForm" onsubmit="addGiveaway(event)" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">📍 บริเวณที่แจก</label>
                    <input type="text" id="location" placeholder="เช่น หน้าฮอลล์, โซนแจกหน้าคอน" required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🎁 ชื่อ Giveaway</label>
                    <input type="text" id="giveawayName" placeholder="เช่น พวงกุญแจเซน, สบต.เยือนไทย" required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🔢 จำนวน (ตัวเลขเท่านั้น)</label>
                    <input type="number" id="quantity" placeholder="เช่น 100" required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🔗 Link Twitter (X)</label>
                    <input type="text" id="tweetUrl" placeholder="https://x.com/username/status/..." required class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">🖼️ Upload Photo (สัดส่วน 1:1)</label>
                    <input type="file" id="imageFile" accept="image/*" required class="w-full px-3 py-2 border rounded-xl text-xs text-slate-500 file:mr-4 file:py-1 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-600 hover:file:bg-indigo-100">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">📝 รายละเอียดเพิ่มเติม</label>
                    <textarea id="caption" rows="2" placeholder="รายละเอียดเพิ่มเติม (ถ้ามี)..." class="w-full px-3 py-2 border rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                </div>
                <div class="flex justify-end space-x-2 pt-2">
                    <button type="button" onclick="closeAddModal()" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded-xl">ยกเลิก</button>
                    <button type="submit" id="submitBtn" class="px-4 py-2 text-sm bg-indigo-600 text-white font-medium rounded-xl hover:bg-indigo-700">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal สำหรับขยายดูรูปภาพใหญ่ -->
    <div id="imageModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-50" onclick="closeImageModal()">
        <div class="relative max-w-3xl max-h-[90vh] w-full flex items-center justify-center" onclick="event.stopPropagation()">
            <button onclick="closeImageModal()" class="absolute -top-10 right-0 text-white text-xl font-bold bg-white/20 hover:bg-white/40 w-8 h-8 rounded-full flex items-center justify-center transition">✕</button>
            <img id="modalImage" src="" alt="Zoomed Freebie" class="max-w-full max-h-[85vh] object-contain rounded-xl shadow-2xl">
        </div>
    </div>

    <!-- Custom Popup Card -->
    <div id="customPopup" class="fixed inset-0 bg-black/40 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl p-6 max-w-sm w-full shadow-2xl text-center transform transition-all">
            <div id="popup-icon" class="text-3xl mb-3">✨</div>
            <h4 id="popup-title" class="text-base font-bold text-slate-800 mb-1">แจ้งเตือน</h4>
            <p id="popup-message" class="text-xs text-slate-500 mb-5">ข้อความแจ้งเตือน...</p>
            <button onclick="closePopup()" class="w-full py-2.5 bg-indigo-600 text-white text-xs font-semibold rounded-xl hover:bg-indigo-700 transition">ตกลง</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xrpifshmpqpotalzqjsw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhycGlmc2htcHFwb3RhbHpxanN3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODYzNzUyNTQsImV4cCI6MjEwMTk1MTI1NH0.lsLrVMib26Rgg32mLAr8ZHpoV-qmMmy8KPD6J1e-FSs';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let currentUser = null;
        let allGiveaways = [];
        let showingOnlyMine = false;

        function showPopup(title, message, icon = '✨') {
            document.getElementById('popup-title').innerText = title;
            document.getElementById('popup-message').innerText = message;
            document.getElementById('popup-icon').innerText = icon;
            document.getElementById('customPopup').classList.remove('hidden');
        }

        function closePopup() {
            document.getElementById('customPopup').classList.add('hidden');
        }

        function openImageModal(url) {
            document.getElementById('modalImage').src = url;
            document.getElementById('imageModal').classList.remove('hidden');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.add('hidden');
        }

        async function checkUser() {
            const { data: { session } } = await sbClient.auth.getSession();
            if (session && session.user) {
                let name = session.user.user_metadata.user_name || session.user.user_metadata.preferred_username || session.user.email || 'User';
                if (!name.startsWith('@')) name = '@' + name;
                currentUser = name;
                updateAuthUI();
            }
        }

        function updateAuthUI() {
            if (currentUser) {
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('user-container').classList.remove('hidden');
                document.getElementById('display-user').innerText = currentUser;
            } else {
                document.getElementById('login-container').classList.remove('hidden');
                document.getElementById('user-container').classList.add('hidden');
            }
        }

        async function loginWithTwitter() {
            const { error } = await sbClient.auth.signInWithOAuth({
                provider: 'x',
                options: { redirectTo: window.location.origin }
            });
            if (error) showPopup('เกิดข้อผิดพลาด', 'ล็อกอินไม่สำเร็จ: ' + error.message, '❌');
        }

        async function logout() {
            await sbClient.auth.signOut();
            currentUser = null;
            updateAuthUI();
            window.location.reload();
        }

        async function fetchGiveaways() {
            const { data, error } = await sbClient.from('giveaways').select('*').order('id', { ascending: false });
            if (error) {
                showPopup('เกิดข้อผิดพลาด', 'ไม่สามารถโหลดข้อมูลได้: ' + error.message, '❌');
                return;
            }
            allGiveaways = data || [];
            renderGiveaways();
        }

        function renderGiveaways() {
            const grid = document.getElementById('giveaway-grid');
            let dataToRender = allGiveaways;

            if (showingOnlyMine) {
                dataToRender = allGiveaways.filter(item => item.twitter_handle === currentUser);
                document.getElementById('sub-title').innerText = `แสดงเฉพาะของคุณ (${currentUser})`;
            } else {
                document.getElementById('sub-title').innerText = '💙💜🩷❤️🖤';
            }

            if (!dataToRender || dataToRender.length === 0) {
                grid.innerHTML = `<div class="text-center col-span-full py-10 text-slate-400">ยังไม่มีรายการของแจกในขณะนี้</div>`;
                return;
            }

            grid.innerHTML = dataToRender.map(item => {
                const isOwner = (currentUser && item.twitter_handle === currentUser);
                const imageUrl = item.image_url || 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&auto=format&fit=crop&q=60';
                
                // รองรับข้อมูลเก่าที่อาจจะยังไม่มีคอลัมน์ใหม่
                const giveawayName = item.giveaway_name || 'Giveaway';
                const location = item.location || 'ไม่ระบุสถานที่';
                const quantity = item.quantity || '-';
                const captionText = item.caption ? `<div class="text-xs text-slate-500 mt-1">${item.caption}</div>` : '';

                return `
                    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between overflow-hidden hover:shadow-md transition">
                        <div>
                            // ส่วน Header การ์ดใน renderGiveaways()
<div class="p-4 pb-2 flex justify-between items-center relative">
    <span class="text-xs font-bold text-slate-700">${item.twitter_handle}</span>
    <div class="flex items-center space-x-1.5">
        <button type="button" onclick="toggleStatus(${item.id}, '${item.twitter_handle}', '${item.status}')" class="px-2.5 py-1 rounded-full text-xs font-medium ${isOwner ? 'cursor-pointer hover:opacity-80 shadow-sm' : 'cursor-default'} ${item.status === 'หมดแล้ว' ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}">
            ${item.status === 'หมดแล้ว' ? '🔴 หมดแล้ว' : '🟢 กำลังแจก'} ${isOwner ? '⚙️' : ''}
        </button>
        
        <!-- ปุ่มจุดสามจุดสำหรับเจ้าของโพสต์ -->
        ${isOwner ? `
            <div class="relative">
                <button type="button" onclick="toggleCardDropdown(event, ${item.id})" class="w-7 h-7 flex items-center justify-center rounded-full hover:bg-slate-100 text-slate-500 transition text-xs font-bold">
                    ⋮
                </button>
                <!-- กล่องเมนูดรอปดาวน์ของการ์ด -->
                <div id="cardDropdown-${item.id}" class="card-dropdown hidden absolute right-0 mt-1 w-32 bg-white border border-slate-100 rounded-xl shadow-lg py-1 z-30">
                    <button type="button" onclick="openEditModal(${item.id})" class="w-full text-left px-3 py-2 text-xs text-slate-700 hover:bg-slate-50 flex items-center space-x-1.5 border-b border-slate-100">
                        <span>✏️ แก้ไข</span>
                    </button>
                    <button type="button" onclick="deleteGiveaway(${item.id}, '${item.twitter_handle}')" class="w-full text-left px-3 py-2 text-xs text-rose-600 hover:bg-rose-50 flex items-center space-x-1.5">
                        <span>🗑️ ลบ</span>
                    </button>
                </div>
            </div>
        ` : ''}
    </div>
</div>
                            
                            <!-- รูปภาพสัดส่วน 1:1 -->
                            <div class="w-full aspect-square bg-slate-100 relative overflow-hidden flex items-center justify-center border-y border-slate-100 cursor-pointer group" onclick="openImageModal('${imageUrl}')">
                                <img src="${imageUrl}" alt="Freebie Image" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                                <div class="absolute inset-0 bg-black/20 opacity-0 group-hover:opacity-100 transition flex items-center justify-center text-white text-xs font-medium">
                                    🔍 คลิกเพื่อดูรูปใหญ่
                                </div>
                            </div>

                            <!-- ข้อมูลรายละเอียด -->
                            <div class="p-4 space-y-1.5">
                                <h4 class="text-sm font-bold text-indigo-600">${giveawayName}</h4>
                                <div class="flex items-center justify-between text-xs text-slate-600">
                                    <span>📍 ${location}</span>
                                    <span class="bg-slate-100 px-2 py-0.5 rounded-md font-semibold">📦 จำนวน: ${quantity} ชิ้น</span>
                                </div>
                                ${captionText}
                            </div>
                        </div>

                        <!-- Footer ลิงก์ทวีตต้นฉบับ -->
                        <div class="px-4 pb-4 pt-1">
                            <a href="${item.tweet_url}" target="_blank" class="block w-full py-2 bg-slate-50 hover:bg-slate-100 text-indigo-600 text-center text-xs font-semibold rounded-xl transition border border-slate-100">
                                🔗 ไปที่โพสต์ต้นฉบับบน X
                            </a>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function openAddModal() {
            if (!currentUser) {
                showPopup('แจ้งเตือน', 'กรุณาเข้าสู่ระบบด้วย X ก่อนเพิ่มของแจก', '⚠️');
                return;
            }
            document.getElementById('addModal').classList.remove('hidden');
        }

        function closeAddModal() {
            document.getElementById('addModal').classList.add('hidden');
        }

        async function addGiveaway(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = 'กำลังอัปโหลด...';
            submitBtn.disabled = true;

            try {
                const twitter_handle = currentUser;
                const location = document.getElementById('location').value;
                const giveaway_name = document.getElementById('giveawayName').value;
                const quantity = document.getElementById('quantity').value;
                const tweet_url = document.getElementById('tweetUrl').value;
                const caption = document.getElementById('caption').value;
                const fileInput = document.getElementById('imageFile');
                const file = fileInput.files[0];
                let imageUrl = '';

                if (file) {
                    const fileName = `${Date.now()}_${file.name}`;
                    const { data: uploadData, error: uploadError } = await sbClient.storage
                        .from('plli-photo')
                        .upload(fileName, file);

                    if (uploadError) throw new Error('อัปโหลดรูปไม่สำเร็จ: ' + uploadError.message);

                    const { data: publicUrlData } = sbClient.storage
                        .from('plli-photo')
                        .getPublicUrl(fileName);
                    imageUrl = publicUrlData.publicUrl;
                }

                const id = Date.now();
                const { error: insertError } = await sbClient.from('giveaways').insert([{
                    id, 
                    twitter_handle, 
                    location, 
                    giveaway_name, 
                    quantity, 
                    tweet_url, 
                    image_url: imageUrl, 
                    caption, 
                    status: 'กำลังแจก'
                }]);

                if (insertError) throw new Error(insertError.message);

                closeAddModal();
                document.getElementById('giveawayForm').reset();
                showPopup('สำเร็จ', 'ลงทะเบียนเรียบร้อยแล้ว!', '🎉');
                fetchGiveaways();
            } catch (err) {
                showPopup('เกิดข้อผิดพลาด', err.message, '❌');
            } finally {
                submitBtn.innerText = 'บันทึก';
                submitBtn.disabled = false;
            }
        }

        async function toggleStatus(id, itemOwner, currentStatus) {
            if (!currentUser) {
                showPopup('แจ้งเตือน', 'กรุณาเข้าสู่ระบบก่อนเปลี่ยนสถานะ', '⚠️');
                return;
            }
            if (currentUser !== itemOwner) {
                showPopup('ไม่อนุญาต', 'คุณสามารถเปลี่ยนสถานะได้เฉพาะของที่คุณเป็นเจ้าของเท่านั้น!', '🔒');
                return;
            }

            const newStatus = currentStatus === 'กำลังแจก' ? 'หมดแล้ว' : 'กำลังแจก';
            const { error } = await sbClient.from('giveaways').update({ status: newStatus }).eq('id', id);

            if (error) {
                showPopup('เกิดข้อผิดพลาด', error.message, '❌');
            } else {
                fetchGiveaways();
            }
        }

        let pendingDeleteId = null;

        function deleteGiveaway(id, itemOwner) {
            if (!currentUser) {
                showPopup('แจ้งเตือน', 'กรุณาเข้าสู่ระบบก่อนลบรายการ', '⚠️');
                return;
            }
            if (currentUser !== itemOwner) {
                showPopup('ไม่อนุญาต', 'คุณสามารถลบได้เฉพาะของที่คุณเป็นเจ้าของเท่านั้น!', '🔒');
                return;
            }

            pendingDeleteId = id;
            document.getElementById('popup-title').innerText = 'ยืนยันการลบ';
            document.getElementById('popup-message').innerText = 'คุณต้องการลบรายการของแจกนี้ใช่หรือไม่?';
            document.getElementById('popup-icon').innerText = '🗑️';

            const popupBox = document.querySelector('#customPopup > div');
            let actionArea = document.getElementById('popup-action-area');
            if (!actionArea) {
                actionArea = document.createElement('div');
                actionArea.id = 'popup-action-area';
                actionArea.className = 'flex space-x-2 mt-4';
                const oldBtn = popupBox.querySelector('button');
                oldBtn.style.display = 'none';
                popupBox.appendChild(actionArea);
            }

            actionArea.innerHTML = `
                <button onclick="closePopupCustom()" class="w-1/2 py-2.5 bg-slate-100 text-slate-600 text-xs font-semibold rounded-xl hover:bg-slate-200 transition">ยกเลิก</button>
                <button onclick="confirmDelete()" class="w-1/2 py-2.5 bg-rose-600 text-white text-xs font-semibold rounded-xl hover:bg-rose-700 transition">ยืนยันลบ</button>
            `;
            document.getElementById('customPopup').classList.remove('hidden');
        }

        async function confirmDelete() {
            if (!pendingDeleteId) return;
            const { error } = await sbClient.from('giveaways').delete().eq('id', pendingDeleteId);
            closePopupCustom();
            if (error) {
                showPopup('เกิดข้อผิดพลาด', error.message, '❌');
            } else {
                showPopup('สำเร็จ', 'ลบรายการเรียบร้อยแล้ว', '🗑️');
                fetchGiveaways();
            }
            pendingDeleteId = null;
        }

        function closePopupCustom() {
            document.getElementById('customPopup').classList.add('hidden');
            const oldBtn = document.querySelector('#customPopup button');
            if (oldBtn) oldBtn.style.display = 'block';
            const actionArea = document.getElementById('popup-action-area');
            if (actionArea) actionArea.remove();
        }

        // ฟังก์ชันเปิด/ปิดเมนูดรอปดาวน์เฉพาะการ์ดนั้นๆ
function toggleCardDropdown(event, id) {
    event.stopPropagation();
    // ปิดดรอปดาวน์อันอื่นๆ ที่อาจเปิดค้างไว้ก่อน
    document.querySelectorAll('.card-dropdown').forEach(el => {
        if (el.id !== `cardDropdown-${id}`) el.classList.add('hidden');
    });
    
    const dropdown = document.getElementById(`cardDropdown-${id}`);
    if (dropdown) {
        dropdown.classList.toggle('hidden');
    }
}

// อัปเดตอีเวนต์คลิกเพื่อปิดดรอปดาวน์เวลาคลิกพื้นที่ว่าง
window.addEventListener('click', function() {
    document.querySelectorAll('.card-dropdown').forEach(el => {
        el.classList.add('hidden');
    });
    const dropdown = document.getElementById('userDropdown');
    if (dropdown && !dropdown.classList.contains('hidden')) {
        dropdown.classList.add('hidden');
    }
});

            showingOnlyMine = true;
            updateToggleButtonText();
            fetchGiveaways();
        }

        function resetFilter() {

            fetchGiveaways();
            const dropdown = document.getElementById('userDropdown');
            if (dropdown) dropdown.classList.add('hidden');
        }
