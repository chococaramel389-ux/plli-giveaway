<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLLI Freebie Board - บอร์ดรวมของแจกคอนเสิร์ต</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold bg-gradient-to-r from-indigo-500 to-pink-500 bg-clip-text text-transparent">
                ✨ PLLI Freebie Board
            </h1>
            <button class="bg-black text-white px-4 py-2 rounded-full text-sm font-medium hover:bg-slate-800 transition">
                ล็อกอินด้วย Twitter
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-5xl mx-auto px-4 py-8">
        <div class="text-center mb-8">
            <h2 class="text-2xl font-bold mb-2">บอร์ดรวบรวมของแจกคอนเสิร์ต PLAVE</h2>
            <p class="text-slate-500 text-sm">รวมพิกัดของแจกน่ารักๆ ในคอนเสิร์ต เช็กสถานะ แจกอยู่ หรือ หมดแล้ว ได้ที่นี่!</p>
        </div>

        <!-- Grid Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
            
            <!-- ตัวอย่างการ์ดที่ 1 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-semibold text-slate-500">@plli_sample</span>
                        <!-- ปุ่มเปลี่ยนสถานะ -->
                        <span class="px-2.5 py-1 rounded-full text-xs font-medium bg-emerald-100 text-emerald-700 cursor-pointer">
                            🟢 กำลังแจก
                        </span>
                    </div>
                    <!-- จำลองพื้นที่ทวีต (Twitter Embed Placeholder) -->
                    <div class="bg-slate-100 rounded-xl p-4 text-center text-xs text-slate-400 mb-3 border border-slate-200">
                        [ โค้ดทวีตแจกของจะแสดงตรงนี้ ]
                    </div>
                </div>
                <p class="text-xs text-slate-500 text-center">โซน A • แจกหน้าฮอลล์</p>
            </div>

            <!-- ตัวอย่างการ์ดที่ 2 -->
            <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                <div>
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-semibold text-slate-500">@plave_lover</span>
                        <span class="px-2.5 py-1 rounded-full text-xs font-medium bg-rose-100 text-rose-700 cursor-pointer">
                            🔴 ของหมดแล้ว
                        </span>
                    </div>
                    <div class="bg-slate-100 rounded-xl p-4 text-center text-xs text-slate-400 mb-3 border border-slate-200">
                        [ โค้ดทวีตแจกของจะแสดงตรงนี้ ]
                    </div>
                </div>
                <p class="text-xs text-slate-500 text-center">โซน K • แจกที่บูธสม</p>
            </div>

        </div>
    </main>
</body>
</html>
